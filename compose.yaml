services:
  app:
    build: .

    ports:
      - 8127:8000 # change the leftmost port with your desired host port

    env_file: '.env'

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  db:
    image: postgres:16.2
    env_file: '.env'

    volumes:
      - ./schema_init.sql:/docker-entrypoint-initdb.d/schema_init.sql
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]

      interval: 5s
      timeout: 10s
      retries: 5

    restart: unless-stopped


volumes:
  postgres_data: