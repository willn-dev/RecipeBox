{% extends 'layout.html' %}

{% block content %}

<style>
    @page {
        size: 8.5in, 11in;
        margin: 1in;
    }
</style>

<div class="flex flex-col justify-center">
    <div class="mt-5 text-center">
        <h1 class="font-bold text-7xl">Menu</h1>
    </div>
    <div class="divider divider-primary w-10/12 mx-auto mt-8"></div>
    
    {%  if recipe_table  %}
        <div id="recipe-names" class="flex flex-col gap-2 justify-center text-center font-bold text-4xl">
            {% for item in recipe_table %}
                <h2>{{ recipe_table[item]['name']}}</h2>
            {% endfor %}
        </div>
    {% endif %}

</div>
{% endblock content %}
