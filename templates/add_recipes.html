{% extends 'layout.html' %}

{% block content %}

<header> 
  <h1 class=" mt-8 mb-8 text-6xl font-mono text-center"> Add a New Recipe</h1>
</header>

<div class="divider divider-primary w-10/12 mx-auto mt-8"></div>

<div class="flex flex-col min-h-screen align-center">

  <form action="{{ url_for('newrecipe') }}" method="post">

    <div class="flex flex-row gap-1 justify-center">
      <fieldset class="fieldset mb-2 w-9/12 md:w-1/4">
        <legend class="fieldset-legend font-mono text-xl text-center">Name</legend>
        <input name="recipe_name" required type="text" class="input input-lg input-primary w-full text-lg font-mono" placeholder="ex: Grand-pappy's Rhubarb Pie" />
      </fieldset>
    </div>

    <div class="divider divider-accent w-10/12 md:w-8/12 mx-auto"></div>


    <div class="flex flex-col md:flex-row gap-2 justify-center w-8/12 mx-auto"> <!-- main form-->

      <fieldset class="fieldset flex-1 md:ml-2">
        <legend class="fieldset-legend font-mono text-2xl">ingredients</legend>

        <div class="flex flex-col">
          <div class="flex flex-row gap-1">
            <input type="text" required name="ingredient" class=" input input-lg input-accent w-full text-lg font-mono">
            <input placeholder="Qty." type="number" name="ingredient-qty" class="input validator input-lg input-accent text-lg font-mono w-1/4">         
          </div>
          <button>new ingredient</button>
        </div> 
      </fieldset>

      <div class=" hidden md:flex divider divider-horizontal divider-accent"></div>

      <fieldset class="fieldset flex-1 md:mr-2">
        <legend class="fieldset-legend font-mono text-2xl">Instructions</legend>
        <textarea class="textarea textarea-accent h-70 w-full text-lg font-mono" placeholder="eg: 1. Heat oven to 350º"></textarea>
        <div class="label">Optional</div>
      </fieldset>
    </div>



  </form>
</div>

{% endblock content %}
