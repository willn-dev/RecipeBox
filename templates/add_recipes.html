{% extends 'layout.html' %}

{% block content %}

<header> 
  <h1 class=" mt-8 mb-8 text-6xl font-mono text-center">{{ 'Edit' if recipes_table else 'Add a New Recipe'}}</h1>
</header>

<div class="divider divider-primary w-10/12 mx-auto mt-8"></div>
  
<div class="flex flex-col min-h-screen align-center">

  <form action="{{ url_for('newrecipe') }}" method="post">

    <div class="flex flex-row gap-1 justify-center items-end">
      <div class="flex-1"></div>

      <div class="flex flex-3 md:flex-1 justify-center">
        <fieldset class="fieldset mb-2 w-full md:w-11/12">
          <legend class="fieldset-legend font-mono text-xl text-center">Name</legend>
          <input name="recipe_name" required type="text" class="input input-lg input-primary w-full text-lg font-mono md:text-center"
          placeholder="ex: Grand-pappy's Rhubarb Pie"
          value="{{ recipes_table[0][1] if recipes_table else '' }}">
          <input name="recipe_id" type="hidden" value="{{ recipes_table[0][0] if recipes_table else '' }}">
        </fieldset>
      </div>

      <!--TODO: WRAP THESE CHILDREN IN DIVS THEN GIVE THEM FLEX 1 TO CENTER AND JUSTIFY-START FOR BUTTON. SEE RHODIA NOTEBOOK SKETCH.-->
      <div class="flex flex-1 justify-start">
        <button class="self-center h-8 w-8 flex-none mb-5 ml-8">
          <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="32" height="32" viewBox="0 0 32 32">
            <path fill="#26659f" fill-rule="evenodd" d="M6.997,4.997v23h2v2h14	v-2h2v-23H6.997z" clip-rule="evenodd"></path><path fill="#064678" fill-rule="evenodd" d="M8.996,9.999v15.999	h2.001V9.999H8.996z" clip-rule="evenodd"></path><path fill="#064678" fill-rule="evenodd" d="M14.996,9.997v15.999	h2.001V9.997H14.996z" clip-rule="evenodd"></path><path fill="#064678" fill-rule="evenodd" d="M20.996,9.999v15.999	h2.001V9.999H20.996z" clip-rule="evenodd"></path><path fill="#26659f" fill-rule="evenodd" d="M18.997,1.997h-6.007	v3.001h6.007V1.997z" clip-rule="evenodd"></path><path fill="#589bd4" fill-rule="evenodd" d="M27,3.997H4.996v2.001	H27V3.997z" clip-rule="evenodd"></path>
          </svg>
        </button>
        </div>
    </div>

    <div class="divider divider-accent w-10/12 md:w-8/12 mx-auto"></div>


    <div class="flex flex-col md:flex-row gap-2 justify-center w-8/12 mx-auto"> <!-- main form-->

      <fieldset class="fieldset flex-1 md:ml-2 overflow-visible">
        <legend class="fieldset-legend font-mono text-2xl">ingredients</legend>

        <div id="ingredient-col" class="flex flex-col">
          <!--DYNAMICALLY ADD EXISTING INGREDIENTS IF EDITING.-->
         
          {% if join_table %}
            {% for row in join_table %}
              <div class="flex flex-row gap-1 items-center relative">
                <button class="btn btn-ghost md:btn-xs align-center absolute -left-11 md:-left-6" id="removeIngredient" onclick="this.parentElement.remove()">&times;</button>
                <input type="text" value="{{row[4]}}" required name="ingredient_name" class=" input input-lg input-accent w-full text-lg font-mono"> <!--4 is the ingredient name-->
                <input placeholder="Qty." value='{{row[2]}}' type="text" name="ingredient_qty" class="input validator input-lg input-accent text-lg font-mono w-1/4"> <!--2 is quantity-->
              </div>


            {% endfor %}

          {% else %}
            <div class="flex flex-row gap-1 items-center relative">
              <button class="btn btn-ghost md:btn-xs align-center absolute -left-11 md:-left-6" id="removeIngredient" onclick="this.parentElement.remove()">&times;</button>
              <input type="text" required name="ingredient_name" class=" input input-lg input-accent w-full text-lg font-mono">
              <input placeholder="Qty." type="text" name="ingredient_qty" class="input validator input-lg input-accent text-lg font-mono w-1/4">         
            </div>
          {% endif %}

          <button id="add-new-btn" type="button" class="btn btn-neutral mt-3 mb-3">Add New</button>
        </div> 
      </fieldset>

      <div class=" hidden md:flex divider divider-horizontal divider-accent"></div>

      <fieldset class="fieldset flex-1 md:mr-2">
        <legend class="fieldset-legend font-mono text-2xl">Instructions</legend>
        <textarea name="instructions" 
          class="textarea textarea-accent h-70 w-full text-lg font-mono"
          placeholder="eg: 1. Heat oven to 350º">{{ recipes_table[0][2] if recipes_table else '' }}</textarea>
        <div class="label">Optional</div>
      </fieldset>
    </div>

  <div class="flex justify-center">
    <div class="flex divider divider-accent w-10/12 md:w-8/12"></div>
  </div>

  <div class="flex flex-row justify-center">
    <button type="submit" class="btn btn-lg btn-primary">Submit</button>
  </div>

  </form>
</div>
<script src="{{ url_for('static', filename= 'js/add_ingredient.js') }}"></script>
{% endblock content %}
