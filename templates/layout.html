<!--Layout.html is the convention name for a base file to inherit from 
in flask.-->

{% block boilerplate %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% if pagename %}
            {{pagename}}
        {% else %}
        RecipeBowl
        {% endif %}
        
    </title>
</head>
<body>
    
</body>
</html>

{% endblock boilerplate %}
