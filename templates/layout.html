<!--Layout.html is the convention name for a base file to inherit from 
in flask.-->

<!DOCTYPE html>
<html lang="en" data-theme="dim">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% if pagename %}
            {{pagename}}
        {% else %}
        RecipeBowl
        {% endif %}
        
    </title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/output.css') }}">
</head>

<body>
  <div class="navbar bg-neutral text-neutral-content shadow-sm">
    <div class="navbar-start">
      <button class="btn btn-square btn-ghost">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block h-5 w-5 stroke-current"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path> </svg>
      </button>
    </div>

   <div class="navbar-center">
    <a class="btn btn-ghost text-xl">RecipeBowl</a>
  </div>

  <div class="navbar-end">
    <button class="btn btn-square btn-ghost">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block h-5 w-5 stroke-current"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z"></path> </svg>
    </button>
  </div>
</div>



    {% block content %}
    {% endblock content %}
</body>

</html>
