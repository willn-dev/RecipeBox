<div id="hero-fullheight" class="overflow-hidden">

          <h1 class="text-5xl font-bold mb-7">How many days would you like to plan?</h1>
            
            <div class="w-full max-w-xs mx-auto">
                <input type="range" min="1" max="7" value="5" class="range" step="1" />

                    <span>1</span>
                    <span>2</span>
                    <span>3</span>
                    <span>4</span>
