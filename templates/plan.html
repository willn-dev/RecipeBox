{% extends 'layout.html' %}

{% block content %}

<!-- PLAN
    JS can handle initial population by checking the slider value and then using that to populate however many
    in a daisy list element. Then when I click the re roll button on the side. JS can select next from pool
    that is not already selected.

    i need to configure prettier for py js and html
--> 

<div id="hero-fullheight" class="overflow-hidden">
    <div class="hero min-h-screen bg-base-200">
      <div class="hero-content text-center gap-y-27 max-w-md md:max-w-3/4 flex-col">
        
        <h1 class="text-5xl md:text-7xl font-bold">How many days would you like to plan?</h1>
            
        <div class="w-full mx-auto">
            <input id="days_needed" type="range" min="1" max="7" value="5" class="range w-full" step="1" />
            <div class="flex justify-between px-2.5 mt-2 text-xs">
                <span>1</span>
                <span>2</span>
                <span>3</span>
                <span>4</span>
                <span>5</span>
                <span>6</span>
                <span>7</span>
            </div>
        </div>
        <button id="hide_btn" class="btn btn-primary w-1/4">Go!</button>
      </div>
    </div>
</div>

<div id="secondary">

    <div class="text-lg breadcrumbs mx-10">
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="">Plan</a></li>
        </ul>
    </div>



    {% if rand_pool %}
        <div class="flex flex-col items-center">

            <div id="title_holder">
                <h1 class="text-5xl md:text-7xl font-bold">Here you go!</h1>
            </div>
            
            <div class="divider w-3/4 mx-auto"></div>

            <ul id="listHolder" class="list bg-base-200 w-1/2 border-accent rounded-box shadow-md">
                <li class="p-4 pb-2 text-xs opacity-60 tracking-wide">Your meal plan, generated at: {{ dt if dt else 'unknowndate'}}</li>   
            </ul>
        </div>
    {% endif %}   




    </div>
</div>
<script> const recipe_pool = {{ rand_pool | tojson }}; </script>
<script src="{{ 'static/js/planner.js' }}"></script>
{% endblock content %}
